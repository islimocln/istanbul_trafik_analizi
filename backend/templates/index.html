<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstanbul Otel ve Restoran Analizi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f7f7fa;
        }
        .navbar {
            background-color: #2c3e50 !important;
        }
        .navbar .navbar-brand, .navbar .nav-link {
            color: #fff !important;
        }
        .navbar .nav-link.active, .navbar .nav-link:focus, .navbar .nav-link:hover {
            color: #b23a48 !important;
        }
        .aspect-tab {
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 5px;
            background-color: #f4f4f6;
            color: #2c3e50;
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
        }
        .aspect-tab:hover {
            background-color: #ececec;
            color: #b23a48;
        }
        .aspect-tab.active {
            background-color: #b23a48;
            color: #fff;
            border-color: #b23a48;
        }
        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
        }
        .result-card {
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(44,62,80,0.07);
            margin-bottom: 20px;
            transition: transform 0.3s;
            border: 1px solid #e0e0e0;
        }
        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 12px rgba(178,58,72,0.10);
        }
        .stars {
            color: #b23a48;
            font-size: 1.1rem;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-chart-line me-2"></i>
                İstanbul Analiz
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Ana Sayfa</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">Hakkımda</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Analiz Başlıkları</h5>
                    </div>
                    <div class="card-body">
                        <div class="aspect-tab active" data-aspect="temizlik">
                            <i class="fas fa-broom me-2"></i>Temizlik
                        </div>
                        <div class="aspect-tab" data-aspect="fiyat">
                            <i class="fas fa-tag me-2"></i>Fiyat
                        </div>
                        <div class="aspect-tab" data-aspect="lezzet">
                            <i class="fas fa-utensils me-2"></i>Lezzet
                        </div>
                        <div class="aspect-tab" data-aspect="servis">
                            <i class="fas fa-concierge-bell me-2"></i>Servis
                        </div>
                        <div class="aspect-tab" data-aspect="konfor">
                            <i class="fas fa-couch me-2"></i>Konfor
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Yükleniyor...</span>
                    </div>
                    <p class="mt-2">Analiz yapılıyor...</p>
                </div>
                <div id="results">
                    <!-- Sonuçlar buraya gelecek -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let analysisData = null;

        // Analiz verilerini yükle
        async function loadAnalysis() {
            document.querySelector('.loading').style.display = 'block';
            try {
                const response = await fetch('/api/analysis');
                analysisData = await response.json();
                showResults('temizlik'); // Varsayılan olarak temizlik analizini göster
            } catch (error) {
                console.error('Veri yüklenirken hata:', error);
            }
            document.querySelector('.loading').style.display = 'none';
        }

        // Sonuçları göster
        function showResults(aspect) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            // Otelleri sırala
            const sortedHotels = [...analysisData.hotels].sort((a, b) => b.scores[aspect] - a.scores[aspect]);
            const topHotels = sortedHotels.slice(0, 5);

            // Restoranları sırala
            const sortedRestaurants = [...analysisData.restaurants].sort((a, b) => b.scores[aspect] - a.scores[aspect]);
            const topRestaurants = sortedRestaurants.slice(0, 5);

            // Otelleri göster
            resultsDiv.innerHTML += `
                <h3 class="mb-4">
                    <i class="fas fa-hotel me-2"></i>
                    En İyi Oteller
                </h3>
            `;
            topHotels.forEach(hotel => {
                resultsDiv.innerHTML += createResultCard(hotel, aspect, 'hotel');
            });

            // Restoranları göster
            resultsDiv.innerHTML += `
                <h3 class="mb-4 mt-5">
                    <i class="fas fa-utensils me-2"></i>
                    En İyi Restoranlar
                </h3>
            `;
            topRestaurants.forEach(restaurant => {
                resultsDiv.innerHTML += createResultCard(restaurant, aspect, 'restaurant');
            });
        }

        // Sonuç kartı oluştur
        function createResultCard(item, aspect, type) {
            const score = item.scores[aspect];
            const stars = '★'.repeat(Math.floor(score)) + '☆'.repeat(5 - Math.floor(score));
            
            return `
                <div class="card result-card">
                    <div class="card-body">
                        <h5 class="card-title">${item.name}</h5>
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="stars">${stars}</span>
                                <span class="ms-2">${score.toFixed(1)}</span>
                            </div>
                            <small class="text-muted">${item.review_count} yorum</small>
                        </div>
                    </div>
                </div>
            `;
        }

        // Başlık seçimi
        document.querySelectorAll('.aspect-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Aktif başlığı güncelle
                document.querySelectorAll('.aspect-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                // Sonuçları göster
                showResults(tab.dataset.aspect);
            });
        });

        // Sayfa yüklendiğinde analizi başlat
        loadAnalysis();
    </script>
</body>
</html>
